<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>TerraGes · Revisão visual local</title><style>body{margin:0;background:#dce2e8;font:14px system-ui}header{padding:10px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}select{padding:8px}iframe{display:block;border:0;margin:0 auto;background:white;height:860px}</style></head><body><header><strong>Revisão local · dados fictícios</strong><label>Largura <select id="width"><option>360</option><option selected>390</option><option>768</option><option>1440</option></select></label><label>Tela <select id="page"><option value="dashboard">Painel</option><option value="service-orders">Serviços</option><option value="whatsapp-inbox">Envios</option><option value="login">Login</option><option value="service-orders/new">Formulário OS</option></select></label><label>Perfil <select id="role"><option value="admin">Gestor</option><option value="operator">Operador</option></select></label><label>Dados <select id="state"><option value="filled">Preenchido</option><option value="empty">Vazio</option><option value="error">Erro</option></select></label><label>Texto <select id="scale"><option value="16">100%</option><option value="32">200%</option></select></label></header><iframe title="Aplicativo em revisão" id="app" width="390"></iframe><script type="module">const frame=document.querySelector('iframe');function update(){frame.width=document.querySelector('#width').value;frame.src='./fixture.html?page='+encodeURIComponent(document.querySelector('#page').value)+'&role='+document.querySelector('#role').value+'&state='+document.querySelector('#state').value+'&scale='+document.querySelector('#scale').value;}document.querySelectorAll('select').forEach(s=>s.addEventListener('change',update));update();</script></body></html>
